version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payflow-core-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://payflow_user:payflow_secret_pwd@postgres:5432/payflow_db?schema=public
      - REDIS_URL=redis://redis:6379
      - API_SECRET_SALT=payflow_production_secure_salt_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - payflow-network

  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_secret_pwd
      POSTGRES_DB: payflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow_user -d payflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payflow-network

volumes:
  postgres_data:
  redis_data:

networks:
  payflow-network:
    driver: bridge
