openapi: 3.1.0
info:
  title: "<SERVICE_NAME> Service API Contract"
  description: |
    Canonical REST API Contract for <SERVICE_NAME>.
    Governed by System Architect and verified during pull request audits.
  version: "1.0.0"
  contact:
    name: Architecture & Engineering Team
servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Environment
  - url: https://api.staging.<DOMAIN>/v1
    description: Staging Environment
  - url: https://api.<DOMAIN>/v1
    description: Production Environment

tags:
  - name: Core Domain
    description: Primary business operations for this bounded context
  - name: Health & Operations
    description: Observability, readiness, and liveness probes

paths:
  /health:
    get:
      summary: Liveness and Readiness Probe
      tags: [Health & Operations]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  timestamp: { type: string, format: date-time }
                  uptimeSeconds: { type: number, example: 1240.5 }

  /<RESOURCE_PLURAL>:
    get:
      summary: List <RESOURCE_PLURAL> with pagination and filtering
      tags: [Core Domain]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Paginated collection of <RESOURCE_PLURAL>
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/<RESOURCE_NAME>'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create a new <RESOURCE_NAME>
      tags: [Core Domain]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create<RESOURCE_NAME>Input'
      responses:
        '201':
          description: <RESOURCE_NAME> created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<RESOURCE_NAME>'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /<RESOURCE_PLURAL>/{id}:
    get:
      summary: Get <RESOURCE_NAME> by ID
      tags: [Core Domain]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: <RESOURCE_NAME> details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<RESOURCE_NAME>'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT bearer token

  schemas:
    <RESOURCE_NAME>:
      type: object
      required: [id, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: "res_01HZX8N6W"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Create<RESOURCE_NAME>Input:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100

    PaginationMeta:
      type: object
      required: [total, page, limit, totalPages]
      properties:
        total: { type: integer, example: 150 }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 8 }

    ProblemDetails:
      type: object
      description: RFC 7807 Standard Error Response
      required: [type, title, status]
      properties:
        type:
          type: string
          example: "https://errors.domain.com/bad-request"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "The field 'name' is required and must have at least 2 characters."
        instance:
          type: string
          example: "/api/v1/<RESOURCE_PLURAL>"
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: Invalid request parameters or payload
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Missing or expired authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Insufficient RBAC permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Requested entity does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Unique constraint or optimistic lock version collision
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
